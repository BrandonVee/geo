          $ref: "#/components/responses/Forbidden"
        "410":
          description: 旧多 Key 写入已弃用
  /v1/admin/answerbit-api-calls:
    get:
      summary: 查询全平台 AnswerBit 调用健康记录
      description: 分页返回调用、所属企业及操作用户名称和账号；操作用户为空表示平台系统任务。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          description: 按 operation、requestId、错误码、企业名称、用户名称或账号模糊查询
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum:
              - success
              - failed
              - timeout
      responses:
        "200":
          description: 包含企业与操作用户归属的调用记录分页列表
  /v1/saved-views:
    get:
      summary: 查询当前用户的保存视图
      tags:
        - Workspace Extensions
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - in: query
          name: page
          schema:
            type: string
            enum:
              - dashboard
              - monitoring
              - answers
              - content
              - metering
      responses:
        "200":
          description: 用户在企业内的保存视图
    post:
      summary: 保存当前筛选组合
      description: 创建与审计原子提交；相同企业、用户、键和原创建内容重放返回当前视图，不重复创建。删除后原创建重放返回 SAVED_VIEW_REMOVED，不复活视图。响应不包含内部创建键、指纹或删除标记。
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]+$"
      tags:
        - Workspace Extensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedView"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 原创建请求重放成功，data.replayed=true
        "201":
          description: 保存视图已创建，data.replayed=false
        "409":
          description: SAVED_VIEW_NAME_EXISTS、SAVED_VIEW_IDEMPOTENCY_CONFLICT 或 SAVED_VIEW_REMOVED
  /v1/saved-views/{viewId}:
    patch:
      summary: 更新自己的保存视图
      description: 至少提供 name、filters、isDefault 中一个更新字段。可选 expected 用于比较原配置；已达到目标的重试直接返回当前视图，否则并发变更返回409，保留原配置。
      tags:
        - Workspace Extensions
      parameters:
        - in: path
          name: viewId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - organizationId
              properties:
                organizationId:
                  type: string
                  format: uuid
                name:
                  type: string
                filters:
                  type: object
                isDefault:
                  type: boolean
                expected:
                  $ref: "#/components/schemas/SavedViewExpected"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 保存视图已更新或目标配置已达到
        "404":
          description: SAVED_VIEW_NOT_FOUND
        "409":
          description: SAVED_VIEW_NAME_EXISTS 或 SAVED_VIEW_VERSION_CONFLICT；版本冲突的 error.details.current 为最新视图
    delete:
      summary: 删除自己的保存视图
      tags:
        - Workspace Extensions
      parameters:
        - in: path
          name: viewId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationAction"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "204":
          description: 保存视图已删除或当前用户范围内已经不存在；重复删除不重复审计
  /v1/report-exports:
    get:
      description: 要求当前企业、绑定、品牌的 report.export 权限，可见同品牌历史任务；筛选参数取交集。
      summary: 查询当前品牌的报表导出任务
      tags:
        - Workspace Extensions
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/TeamBindingId"
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          description: 按文件名、报告编号或原关键词检索，通配符按原文字匹配
          schema:
            type: string
            maxLength: 500
            default: ""
        - in: query
          name: reportType
          schema:
            type: string
            enum: [answers, domain_rank, article_rank]
        - in: query
          name: status
          description: 成功但文件已到期的任务实时归入 expired，不归入 succeeded
          schema:
            type: string
            enum: [queued, running, succeeded, failed, expired]
        - in: query
          name: beginDate
          description: 北京时间提交开始日期（含），可单独使用
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          description: 北京时间提交结束日期（含），可单独使用，不能早于开始日期
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 导出任务分页列表；包含原始 filters、面向用户的 errorMessage、到期状态和有效 downloadUrl，不返回 CSV 内容；总数与分页处于同一租户快照，按提交时间与ID稳定倒序，超界页码回退
        "400":
          description: 无效筛选或日期
        "403":
          description: 当前品牌无报告权限
    post:
      summary: 创建异步 CSV 报表导出
      description: 创建和 Worker 执行时均重新校验企业、TeamID、品牌和 report.export 权限；报告、平台报表额度预留、队列任务和审计原子提交，中途失败全部回滚。同一幂等键仅允许原请求用户、范围、报表类型和筛选条件一致的重放。
      tags:
        - Workspace Extensions
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportExport"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 导出任务已创建
        "200":
          description: 幂等重放；旧的不完整任务可恢复为已入队任务或明确失败的原任务，失败后支持新键重新导出。
        "402":
          description: 报告权益未配置或导出额度不足；不留下新建半成品任务。
        "409":
          description: REPORT_EXPORT_IDEMPOTENCY_CONFLICT；同一幂等键对应的用户、范围或筛选条件不同
  /v1/report-exports/{exportId}:
    get:
      summary: 查询导出任务状态
      tags:
        - Workspace Extensions
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: 导出任务详情
        "404":
          description: 任务不存在或无权限
  /v1/report-exports/{exportId}/file:
    get:
      summary: 下载权限复核后的 CSV 文件
      tags:
        - Workspace Extensions
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: UTF-8 CSV 文件
        "409":
          description: 文件尚未生成
        "410":
          description: 文件已过期并清除
  /v1/notification-rules:
    get:
      summary: 查询企业通知阈值规则
      description: 仅企业管理员可读取规则配置。
      tags:
        - Workspace Extensions
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: 通知规则列表
        "403":
          description: 非企业管理员
    post:
      summary: 创建企业通知阈值规则
      tags:
        - Workspace Extensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRuleInput"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 原操作者、范围及完整配置一致的创建重放，返回原规则
        "201":
          description: 通知规则已创建
        "409":
          description: 相同类型和范围的规则已存在
        "422":
          description: TeamID 或品牌范围无效
  /v1/notification-rules/{ruleId}:
    put:
      summary: 全量更新企业通知阈值规则
      tags:
        - Workspace Extensions
      parameters:
        - in: path
          name: ruleId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRuleReplaceInput"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 通知规则已更新
        "409":
          description: NOTIFICATION_RULE_CONFLICT（details.current 为最新配置）或相同类型范围已存在
        "404":
          description: 通知规则不存在
    delete:
      summary: 停用通知阈值规则并保留历史通知
      tags:
        - Workspace Extensions
      parameters:
        - in: path
          name: ruleId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationAction"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "204":
          description: 通知规则已停用
  /v1/notifications:
    get:
      summary: 查询当前用户可见的站内通知
      description: 企业管理员可见企业全部通知；品牌成员只可见其获授权品牌的指标通知。
      tags:
        - Workspace Extensions
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: unreadOnly
          schema:
            type: boolean
            default: false
        - in: query
          name: type
          schema:
            type: string
            enum: [low_credits, connection_failure, metric_anomaly]
        - in: query
          name: severity
          schema:
            type: string
            enum: [info, warning, critical]
        - in: query
          name: beginDate
          description: 北京时间开始日期（含），可单独使用
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          description: 北京时间结束日期（含），可单独使用；不能早于开始日期
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 通知分页列表、筛选总数与当前用户全部授权范围未读数；页码超界回退至末页
        "400":
          description: 无效筛选或日期
  /v1/notifications/read-all:
    put:
      summary: 将当前筛选全部可见通知标为当前用户已读
      description: 覆盖筛选的所有页，保持其他用户已读状态，重试幂等；企业管理员可处理企业全部通知，品牌成员限授权品牌。
      tags:
        - Workspace Extensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadAllInput"
      responses:
        "200":
          description: 本次新标为已读的通知条数，重复执行为零
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [count]
                    properties:
                      count:
                        type: integer
                        minimum: 0
                  requestId:
                    type: string
        "400":
          description: 无效筛选
        "403":
          description: 没有通知读取权限
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /v1/notifications/{notificationId}/read:
    put:
      summary: 设置当前用户的通知已读状态
      tags:
        - Workspace Extensions
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - organizationId
              properties:
                organizationId:
                  type: string
                  format: uuid
                read:
                  type: boolean
                  default: true
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 已读状态已更新
        "404":
          description: 通知不存在或不可见
  /v1/balances:
    get:
      summary: 查询企业或品牌的双余额账户
      description: answerbit_points 以整数积分计量；publication_cny 以人民币分计量。查询品牌时必须同时传 teamBindingId 和 brandId。
      tags:
        - Balances
      security: &id001
        - cookieSession: []
      parameters:
        - &id002
          in: query
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
        - &id003
          in: query
          name: teamBindingId
          required: false
          schema:
            type: string
            format: uuid
        - &id004
          in: query
          name: brandId
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: 余额账户列表
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/balance-transactions:
    get:
      summary: 查询企业余额划拨与消费流水
      description: 只允许企业管理员，返回完整历史分页及来源、目标账户品牌。系统任务和升级前历史记录的用户字段为空；日期按北京时间闭合范围，总数与明细使用同一租户只读快照，越界页码回退有效末页。
      tags:
        - Balances
      security: *id001
      parameters:
        - *id002
        - in: query
          name: userId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: asset
          required: false
          schema:
            type: string
            enum:
              - answerbit_points
              - publication_cny
        - in: query
          name: operation
          required: false
          schema:
            type: string
            enum:
              - grant
              - allocate
              - consume
              - restore
              - adjust
        - in: query
          name: beginDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 完整余额流水分页，包含 actorUserId、actorName、actorUsername、sourceBrandId、targetBrandId、sourceBrandName 和 targetBrandName
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          pageSize:
                            type: integer
                          total:
                            type: integer
                          pages:
                            type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/balance-transactions/actors:
    get:
      summary: 搜索企业历史流水操作者
      description: 只允许企业管理员，仅返回本企业实际流水中的用户；停用或移除成员仍可核对，姓名和账号通配符按原文匹配。最多返回 20 位。
      tags:
        - Balances
      security: *id001
      parameters:
        - *id002
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 流水操作者数组，包含 id、name、username
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/point-usage:
    get:
      summary: 查询企业或品牌的本地积分余额与消耗
      description: 企业管理员不传品牌范围时读取企业资金池、全部品牌余额合计与消耗/返还统计。查询品牌时必须同时传 teamBindingId 和 brandId；品牌角色仅能读取已授权品牌，不返回企业资金池。类型筛选只影响明细，不影响周期汇总。日期按北京时间计算。余额、汇总与分页来自同一只读快照，页码超界回退实际末页，空结果返回第一页；data.pagination.page 为实际页码。
      tags:
        - Balances
      security: *id001
      parameters:
        - *id002
        - in: query
          name: teamBindingId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: brandId
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - in: query
          name: beginDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: operation
          required: false
          schema:
            type: string
            enum:
              - consume
              - restore
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 品牌当前积分或企业全部品牌积分合计、企业可分配积分（如有权限）、周期消耗/返还汇总和带品牌信息的分页明细
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/balance-allocations:
    post:
      summary: 企业管理员或代理商把企业余额划分到品牌
      description: 要求 balance.allocate 及目标品牌归属；余额、流水和审计原子提交，成功重放不重复审计或占用额度，同键更改品牌、资产、金额、原因或操作者返回 409。
      tags:
        - Balances
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocateBrandBalance"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 划分成功
        "200":
          description: 幂等重放
        "409":
          description: IDEMPOTENCY_CONFLICT；同键内容与原划拨不一致
        "422":
          description: 企业可分配余额不足或代理商积分额度不足
  /v1/balance-allocations/confirmation:
    get:
      summary: 只读核对本人企业品牌划拨
      description: 要求 balance.allocate 及企业品牌归属，使用租户角色与原键事务锁等待已开始的划拨完成；只返回当前操作者在指定品牌的 allocate 流水（含 brandId），未找到时返回 null。不重放写入，不查询其他用户或其他操作。
      tags: [Balances]
      security: *id001
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: brandId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: idempotencyKey
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: 原划拨流水（含目标 brandId）或 null
        "400":
          description: VALIDATION_ERROR；企业、品牌或原请求键无效
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: ORGANIZATION_NOT_FOUND 或 BRAND_NOT_FOUND
  /v1/admin/balance-grants:
    post:
      summary: 平台管理员给企业人工入账
      description: 余额、流水与审计原子提交，同键重放必须保持账户、资产、金额、原因和操作者一致。
      tags:
