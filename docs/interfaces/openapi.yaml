  /v1/admin/answerbit-configuration:
    get:
      summary: 查询平台固定 TeamID、统一 Key 及品牌目录
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      responses:
        "200":
          description: 统一接入状态、掩码、系统 operation 目录、品牌目录和企业绑定统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAnswerBitConfigurationEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: 配置或轮换平台固定 TeamID 与统一 AnswerBit Key
      description: 提交前调用腾讯 `/geo/query/brand` 验证 TeamID 与 Key；系统直接使用已接入 OpenAPI，最终授权由腾讯官方控制台管理。TeamID 首次配置后锁定，后续只轮换 Key。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - teamId
                - apiKey
              properties:
                teamId:
                  type: string
                  minLength: 1
                  maxLength: 128
                apiKey:
                  type: string
                  format: password
                  minLength: 16
                  maxLength: 512
                  writeOnly: true
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 统一配置已加密保存，并刷新腾讯目录及自动生成对应平台企业
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: TeamID 已完成首次配置，不允许变更
        "422":
          description: TeamID、Key 或腾讯侧接口验证未通过
  /v1/admin/answerbit-enterprise-syncs:
    post:
      summary: 运维核对腾讯企业目录
      description: 自动同步异常排查时，使用当前固定 TeamID 与统一 Key 调用腾讯 `/geo/query/brand`，同步新增和名称变更；连续两次完整目录缺失的企业投影将被关闭。日常目录一致性由 Worker 自动维护。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      responses:
        "200":
          description: 腾讯目录核对和平台企业投影同步完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TencentEnterpriseSyncEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 同步期间统一腾讯配置发生变化
        "422":
          description: 统一凭证未配置、不可用或腾讯拒绝查询
        "429":
          description: 腾讯 AnswerBit 限流
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "502":
          description: 腾讯服务或响应暂时异常
        "504":
          description: 腾讯目录查询超时
  /v1/admin/answerbit-brands:
    post:
      summary: 在平台固定 TeamID 下新建腾讯企业
      description: 未提供初始化问题和竞品时调用腾讯 `/geo/brand/create`；提供任一初始化列表时使用固定 TeamID 调用 `/geo/brand/bundle/create`。上游成功返回 BrandID 后写入官方目录并自动生成一一对应的平台企业投影。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - brand
              properties:
                brand:
                  type: string
                  minLength: 1
                  maxLength: 255
                alias:
                  type: string
                  maxLength: 255
                  default: ""
                website:
                  oneOf:
                    - const: ""
                    - type: string
                      format: uri
                  default: ""
                description:
                  type: string
                  maxLength: 5000
                  default: ""
                note:
                  type: string
                  maxLength: 2000
                  default: ""
                iconMimeType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/jpg
                    - image/png
                    - image/gif
                    - image/webp
                    - image/svg+xml
                  description: 与 iconData 同时提供
                iconData:
                  type: string
                  maxLength: 2796204
                  pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
                  description: 有效 Base64 图片内容，解码后的原始文件最大 2MB；与 iconMimeType 同时提供
                initialPrompts:
                  type: array
                  default: []
                  description: 创建品牌时一并初始化的监测问题；非空时启用腾讯 bundle 创建接口
                  items:
                    type: string
                    minLength: 1
                    maxLength: 2000
                competitors:
                  type: array
                  default: []
                  description: 创建品牌时一并初始化的竞品；非空时启用腾讯 bundle 创建接口
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 255
                      alias:
                        type: string
                        maxLength: 255
                        default: ""
                      description:
                        type: string
                        maxLength: 5000
                        default: ""
                      website:
                        oneOf:
                          - const: ""
                          - type: string
                            format: uri
                        default: ""
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 腾讯品牌及对应平台企业已创建，Location 指向返回 BrandID 的平台目录资源
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: 统一凭证未配置、不可用或腾讯拒绝品牌创建
        "429":
          description: 腾讯 AnswerBit 限流
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "502":
          description: 腾讯服务或响应暂时异常
        "504":
          description: 腾讯品牌创建超时
