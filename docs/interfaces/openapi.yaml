        - cookieSession: []
      responses:
        "200":
          description: 腾讯目录企业、用户、有效成员关系、24 小时 AnswerBit 调用指标、Worker 心跳、五项后台周期任务、文章/报告队列与通知规则健康聚合
  /v1/admin/organizations:
    get:
      summary: 分页查询腾讯目录同步企业
      description: 只返回存在 Tencent BrandID 映射且未关闭的企业投影。支持企业/品牌名称、BrandID、企业编号与内部标识搜索；列表和总数使用平台角色的同一只读快照，按接入时间和企业 ID 倒序排列，越界页码回退有效末页。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          description: 企业/品牌名称、BrandID、企业 UUID 或内部标识；按原文匹配，最长 200 字符
          schema:
            type: string
            maxLength: 200
        - in: query
          name: status
          description: 原始手动状态；active 包含服务已到期但未手动冻结的企业
          schema:
            type: string
            enum:
              - active
              - suspended
        - in: query
          name: accessState
          description: 实际服务状态；active 为服务有效或无期限，suspended 为手动冻结，expired 为未手动冻结且服务到期
          schema:
            type: string
            enum: [active, suspended, expired]
      responses:
        "200":
          description: 腾讯企业分页列表；accessState 与 pointsExpired 按服务端快照时间计算，积分到期不改变企业服务状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  data:
                    type: object
                    required: [list, pagination]
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            answerbitBrandId:
                              type: string
                            answerbitBrandName:
                              type: string
                            status:
                              type: string
                              enum: [active, suspended]
                            accessState:
                              type: string
                              enum: [active, suspended, expired]
                            pointsExpired:
                              type: boolean
                            serviceExpiresAt:
                              type: string
                              format: date-time
                              nullable: true
                            pointsExpiresAt:
                              type: string
                              format: date-time
                              nullable: true
                            memberCount:
                              type: integer
                              minimum: 0
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            minimum: 1
                            description: 实际页码；超界回退有效末页，空结果为 1
                          pageSize:
                            type: integer
                            minimum: 1
                            maximum: 100
                          total:
                            type: integer
                            minimum: 0
                          pages:
                            type: integer
                            minimum: 0
        "400":
          description: VALIDATION_ERROR；分页、文字长度或筛选值无效
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: 旧版本地企业创建入口
      description: 腾讯官方品牌创建会自动生成企业，目录核对只负责补建异常数据；本入口固定返回 410。
      deprecated: true
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: 本地企业创建已弃用，请通过腾讯企业接口新增
  /v1/admin/organizations/{organizationId}:
    get:
      summary: 查询企业、对应腾讯品牌和成员全景
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 企业详情、对应 Tencent BrandID 和成员关系；成员 accountState（active/disabled/scheduled/expired）与 memberStatus 分别表达全局账号有效性和企业成员状态
        "404":
          description: 企业不存在
    patch:
      summary: 更新企业状态、服务有效期和积分有效期
      description: 只保存提交的字段。可选 expected 在行锁内核对原值，提供时必须包含所有修改字段的原值；平台客户端始终提供。状态、期限与审计原子提交。恢复到期企业须同时提供未来服务期限。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              anyOf:
                - required: [status]
                - required: [serviceExpiresAt]
                - required: [pointsExpiresAt]
              properties:
                serviceExpiresAt:
                  type: string
                  format: date-time
                  description: 企业到期时间，到期冻结企业业务
                pointsExpiresAt:
                  type: string
                  format: date-time
                  description: 企业积分到期时间，到期停止积分消费
                status:
                  type: string
                  enum:
                    - active
                    - suspended
                expected:
                  type: object
                  additionalProperties: false
                  description: 管理员读到的原值；可额外核对未修改字段以防并发冻结或续期
                  properties:
                    status:
                      type: string
                      enum: [active, suspended]
                    serviceExpiresAt:
                      type: string
                      format: date-time
                      nullable: true
                    pointsExpiresAt:
                      type: string
                      format: date-time
                      nullable: true
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 企业状态或有效期与审计已在同一事务提交
        "409":
          description: ORGANIZATION_SETTINGS_CONFLICT；原值与当前设置不符，details.current 返回最新企业设置，不写入或审计
        "422":
          description: ORGANIZATION_SERVICE_EXPIRED；恢复后的服务期限已过，须续期后恢复，details.current 返回当前企业设置
        "404":
          description: 企业不存在或已关闭
