      summary: 轮询文章生成任务状态和结果
      tags:
        - Articles
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/TeamBindingId"
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
