          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: memberId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - disabled
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 成员状态已更新
        "402":
          description: 恢复成员时成员权益未配置或有效成员名额已满
        "409":
          description: 操作会导致企业没有可用管理员
    delete:
      summary: 移除企业成员及其品牌权限
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: memberId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 成员已移除
        "409":
          description: 操作会导致企业没有管理员
  /v1/admin/users:
    get:
      summary: 分页查询全平台用户
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - disabled
              - scheduled
              - expired
        - in: query
          name: accountType
          description: 按平台账户类型筛选
          schema:
            type: string
            enum:
              - admin
              - agent
              - customer
      responses:
        "200":
          description: 用户分页列表
    post:
      summary: 人工创建管理员、代理或客户账户
      description: 创建账号和 scrypt 密码凭据；管理员账户会自动授予全局平台管理员角色。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - username
                - password
                - accountType
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                username:
                  type: string
                  pattern: ^[a-z][a-z0-9_]{2,31}$
                  example: east_agent
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
                accountType:
                  type: string
                  enum:
                    - admin
                    - agent
                    - customer
                pricingTier:
                  type: string
                  description: 仅代理商可设置；未提供时默认铜牌代理
                  enum:
                    - bronze
                    - silver
                    - gold
                agentValidFrom:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: 代理商生效时间；留空表示立即生效
                agentExpiresAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: 代理商到期时间；留空表示长期有效
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 账户创建成功
        "409":
          description: 账号已存在或管理员角色尚未初始化
  /v1/admin/users/{userId}:
    get:
      summary: 查询用户的企业、品牌权限及代理商额度
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 用户详情、企业成员关系、品牌权限、按企业功能范围及代理商额度用量
        "404":
          description: 用户不存在
    patch:
      summary: 更新用户类型、有效期、代理商额度及目标企业功能范围
      description: 企业功能范围与角色权限取交集，只能收窄而不能提升角色权限；额度仅适用于代理商，null 表示不限，0 表示禁止。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: 用户显示名称，去除首尾空白；不修改登录用户名
                status:
                  type: string
                  enum:
                    - active
                    - disabled
                accountType:
                  type: string
                  description: 管理员类型不可切换
                  enum:
                    - agent
                    - customer
                pricingTier:
                  type: string
                  description: 代理商使用金银铜等级；客户固定为普通用户
                  enum:
                    - retail
                    - bronze
                    - silver
                    - gold
                agentValidFrom:
                  type:
                    - string
                    - "null"
                  format: date-time
                agentExpiresAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                agentQuota:
                  $ref: "#/components/schemas/AgentQuota"
                organizationFeatureScopes:
                  type: array
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/OrganizationFeatureScope"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 用户状态、类型、有效期、额度或企业功能范围已更新；类型切换与停用会撤销现有 Session
        "409":
          description: 当前角色与目标类型冲突，或主动变更账号会让企业失去最后可用管理员（LAST_TENANT_ADMIN，details.organizations 为需交接企业 ID/名称）
        "422":
          description: 禁止停用当前管理员自身、有效时间范围无效、非代理商设置额度，或目标企业不属于该用户
  /v1/admin/audit-logs:
    get:
      summary: 查询全平台不可变操作审计
