  /v1/answerbit/article-jobs:
    get:
      summary: 查询当前品牌文章生成任务
      tags:
        - Articles
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/TeamBindingId"
        - $ref: "#/components/parameters/BrandId"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 不含原始生成参数的任务列表
    post:
      summary: 创建异步文章生成任务
      description: 任务、入队和审计原子提交后立即返回；Worker 才调用 AnswerBit 并按已保存价格计费。相同企业与 Idempotency-Key 校验原操作者、品牌和生成内容后返回原任务；旧的未入队等待任务可补全入队并保留原价格，执行中或已结束任务不重新投递。
      tags:
        - Articles
      security:
        - cookieSession: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArticleJob"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "202":
          description: 任务已进入队列
        "200":
          description: 幂等重放，返回已有任务
        "409":
          description: FEATURE_PRICE_CHANGED，用户看到的积分报价已变化，未创建任务；或 ARTICLE_JOB_IDEMPOTENCY_CONFLICT，同键对应的操作人、范围或生成内容不同。
        "503":
          description: ARTICLE_QUEUE_UNAVAILABLE，任务队列不可用；提交回滚，不留下新建失败任务，可使用原键重试。
  /v1/answerbit/article-jobs/{jobId}:
