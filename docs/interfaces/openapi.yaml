openapi: 3.1.0
info:
  title: AnswerBit GEO SaaS API
  version: 1.0.0
  description: >-
    除认证、初始化和平台腾讯配置外，业务 API 要求固定 TeamID 与统一 API Key 已完成验证；前置接入未完成时返回 `422 PLATFORM_TENCENT_CONNECTION_REQUIRED`。所有 API 响应统一返回 `Cache-Control: no-store, max-age=0` 和 `X-Request-ID`；自有 API 的响应头标识与 JSON envelope 一致，Better Auth 保留原生响应体。自有业务 API 只接受 `application/json` 或 `application/*+json` 的 UTF-8 JSON 正文，其他媒体类型返回 `415 UNSUPPORTED_MEDIA_TYPE`；自有业务 API 与 Better Auth POST 的请求体上限均为 4 MiB，超限返回 `413 PAYLOAD_TOO_LARGE`；自有业务 API 的非空正文解析失败返回 `400 INVALID_JSON`。业务写入统一校验浏览器 Origin，未登记来源返回 `403 UNTRUSTED_ORIGIN`。
servers:
  - url: /api
paths:
  /health/live:
    get:
      summary: 查询 Web 进程存活状态
      tags:
        - System
      responses:
        "200":
          description: Web 进程存活
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
  /health/ready:
    get:
      summary: 查询 Web 配置、数据库连接与数据库发布状态
      tags:
        - System
      responses:
        "200":
          description: Web 运行配置、数据库连接、schema 最低修订和 seed 最低修订全部就绪
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "503":
          description: 运行配置无效（CONFIGURATION_INVALID）、数据库依赖未就绪（DEPENDENCY_UNAVAILABLE）、schema 版本未就绪（DATABASE_SCHEMA_NOT_READY）或 seed 版本未就绪（DATABASE_SEED_NOT_READY）
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
  /auth/sign-in/username:
    post:
      summary: 使用账号密码登录
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  pattern: ^[a-z][a-z0-9_]{2,31}$
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
                rememberMe:
                  type: boolean
                  default: true
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 登录成功并创建 Session
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          description: 账号或密码错误
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "403":
          description: 账户已停用，或浏览器来源不受信任（UNTRUSTED_ORIGIN）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "429":
          description: 请求频率过高
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
  /v1/system/bootstrap:
    get:
      summary: 查询系统是否已完成初始化
      tags:
        - System
      responses:
        "200":
          description: 初始化状态
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
    post:
      summary: 首次运行时创建最高权限管理员
      description: 仅在系统尚无本地密码账户时可执行；并发请求由数据库事务锁串行化。
      tags:
        - System
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - username
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                username:
                  type: string
                  pattern: ^[a-z][a-z0-9_]{2,31}$
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 管理员创建成功
        "409":
          description: 系统已完成初始化
        "503":
          description: 基础角色尚未完成种子初始化
  /v1/organizations:
    get:
      summary: 获取当前用户加入的腾讯企业
      description: 只返回由固定 TeamID 腾讯品牌目录生成并已分配给当前用户的企业投影。
      tags:
        - Organizations
      security:
        - cookieSession: []
      responses:
        "200":
          description: 企业列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: 旧版租户自助创建企业入口
      description: 平台企业只由腾讯品牌投影生成，并由平台管理接口直连腾讯完成增删改；本入口固定返回 410。
      deprecated: true
      tags:
        - Organizations
      security:
        - cookieSession: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: 本地企业创建已弃用，请由平台管理员新增腾讯企业
  /v1/organizations/{organizationId}:
    parameters:
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: 获取企业详情
      tags:
        - Organizations
      security:
        - cookieSession: []
      responses:
        "200":
          description: 企业详情
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 企业不存在或当前用户不可见
    patch:
      summary: 旧版更新企业名称入口
      description: 企业名称由腾讯品牌目录同步维护，本入口固定返回 410。
      deprecated: true
      tags:
        - Organizations
      security:
        - cookieSession: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 企业不存在
        "410":
          description: 企业名称由腾讯目录维护
  /v1/answerbit/platform-configuration:
    get:
      summary: 查询当前企业的腾讯接入与品牌状态
      description: 返回平台腾讯服务状态、企业是否接入、对应 Tencent BrandID 和健康时间；不返回 TeamID、内部范围绑定或完整 API Key。
      tags:
        - AnswerBit
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: 当前企业的只读腾讯接入状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - requestId
                properties:
                  data:
                    $ref: "#/components/schemas/TenantAnswerBitConfiguration"
                  requestId:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/answerbit/connections:
    get:
      summary: 查询企业的 AnswerBit 连接（仅返回密钥掩码）
      tags:
        - AnswerBit
      security:
        - cookieSession: []
      parameters:
        - in: query
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 连接列表
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: 旧版租户凭证创建入口
      description: 凭证已改为平台统一管理，此兼容入口固定返回 ANSWERBIT_PLATFORM_MANAGED。
      deprecated: true
      tags:
        - AnswerBit
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - organizationId
              properties:
                organizationId:
                  type: string
                  format: uuid
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "403":
          description: 平台统一管理 AnswerBit API Key
  /v1/answerbit/connections/{connectionId}:
    parameters:
      - in: path
        name: connectionId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: 旧版租户凭证轮换入口
      description: 凭证已改为平台统一管理，此兼容入口固定返回 ANSWERBIT_PLATFORM_MANAGED。
      deprecated: true
      tags:
        - AnswerBit
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - organizationId
              properties:
                organizationId:
                  type: string
                  format: uuid
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "403":
          description: 平台统一管理 AnswerBit API Key
    delete:
      summary: 旧版租户凭证删除入口
      description: 凭证已改为平台统一管理，此兼容入口固定返回 ANSWERBIT_PLATFORM_MANAGED。
      deprecated: true
      tags:
        - AnswerBit
      security:
        - cookieSession: []
      parameters:
        - in: query
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "403":
          description: 平台统一管理 AnswerBit API Key
  /v1/answerbit/connections/{connectionId}/test:
    post:
      summary: 旧版企业连接检测入口
      deprecated: true
      tags:
        - AnswerBit
      security:
        - cookieSession: []
      responses:
        "403":
          description: 统一 Key 检测由平台固定 TeamID 配置管理
  /v1/organizations/{organizationId}/members:
    get:
      summary: 查询企业成员和品牌权限
      tags:
        - Members
      security:
        - cookieSession: []
      responses:
        "200":
          description: 成员目录；status 表示成员状态，accountState 为全局账号当前可用状态（active、disabled、scheduled、expired）
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: 创建客户账号并授权，或绑定已有企业管理员或品牌成员
      tags:
        - Members
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  description: 绑定已有账号；代理商只能绑定为企业管理员
                  required:
                    - username
                    - role
                  properties:
                    username:
                      type: string
                      pattern: ^[a-z][a-z0-9_]{2,31}$
                    role:
                      type: string
                      enum:
                        - tenant_admin
                        - brand_admin
                        - brand_editor
                        - brand_viewer
                - type: object
                  additionalProperties: false
                  description: 创建普通客户账号并原子性授予本企业品牌权限
                  required:
                    - name
                    - username
                    - password
                    - role
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 80
                    username:
                      type: string
                      pattern: ^[a-z][a-z0-9_]{2,31}$
                    password:
                      type: string
                      format: password
                      minLength: 12
                      maxLength: 128
                      description: 必须同时包含字母和数字
                    role:
                      type: string
                      enum:
                        - brand_admin
                        - brand_editor
                        - brand_viewer
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 账号创建或绑定成功并立即生效；品牌角色自动使用本企业 Tencent BrandID
        "402":
          description: 成员权益未配置或有效成员名额已满
        "409":
          description: 创建的登录账号已存在
        "422":
          description: 当前企业尚未形成有效品牌范围、代理商无效或企业额度已用尽
  /v1/organizations/{organizationId}/members/{memberId}:
    patch:
      summary: 启用或停用企业成员
      tags:
        - Members
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - disabled
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 状态已更新
        "402":
          description: 恢复成员时成员权益未配置或有效成员名额已满
        "409":
          description: 操作会导致企业没有可用管理员
    delete:
      summary: 移除成员及其全部品牌权限
      tags:
        - Members
      security:
        - cookieSession: []
      responses:
        "204":
          description: 已移除
        "409":
          description: 操作会移除最后一名企业管理员
  /v1/organizations/{organizationId}/members/{memberId}/brand-access:
    post:
      summary: 新增或更新成员在本企业品牌上的权限
      tags:
        - Members
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - brand_admin
                    - brand_editor
                    - brand_viewer
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 本企业品牌权限已生效
        "422":
          description: 当前企业尚未形成有效品牌范围
  /v1/organizations/{organizationId}/members/{memberId}/brand-access/{accessId}:
    delete:
      summary: 删除成员品牌权限
      tags:
        - Members
      security:
        - cookieSession: []
      responses:
        "204":
          description: 已删除
        "404":
          description: 权限记录不存在
  /v1/answerbit/brands:
    get:
      summary: 同步并查询当前用户在本企业可见的绑定品牌
      description: 腾讯接口返回固定 TeamID 全量目录后，服务端与企业品牌映射求交集，不返回其他企业品牌。
      tags:
        - Brands
      security:
        - cookieSession: []
      parameters:
        - in: query
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: teamBindingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 已按品牌级授权过滤的品牌列表
        "422":
          description: AnswerBit 查询失败
    post:
      summary: 已停用的租户品牌创建入口
      description: 腾讯企业只允许由平台管理员通过官方品牌接口创建；本入口固定返回 410。
      deprecated: true
      tags:
        - Brands
      security:
        - cookieSession: []
      responses:
        "410":
          description: 租户品牌创建已停用，请使用平台腾讯企业管理
  /v1/answerbit/brands/{brandId}:
    patch:
      summary: 已停用的租户品牌修改入口
      description: 腾讯企业资料只允许由平台管理员通过官方品牌接口修改；本入口固定返回 410。
      deprecated: true
      tags:
        - Brands
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: brandId
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "410":
          description: 租户品牌修改已停用，请使用平台腾讯企业管理
  /v1/answerbit/competitors:
    get:
      summary: 同步并查询指定品牌竞品
      tags:
        - Competitors
      security:
        - cookieSession: []
      parameters:
        - in: query
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: teamBindingId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: brandId
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: 竞品列表
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: AnswerBit 查询失败
    post:
      summary: 创建竞品并保存本地映射
      tags:
        - Competitors
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompetitor"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 竞品创建成功
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: AnswerBit 创建失败
  /v1/answerbit/competitors/{competitorId}:
    parameters:
      - in: path
        name: competitorId
        required: true
        schema:
          type: string
          maxLength: 128
    patch:
      summary: 以全量字段语义更新竞品
      tags:
        - Competitors
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompetitor"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 竞品更新成功
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: 删除竞品
      tags:
        - Competitors
      security:
        - cookieSession: []
      parameters:
        - in: query
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: teamBindingId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: brandId
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: 竞品已删除
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/answerbit/dashboard:
    get:
      summary: 获取品牌提及率、平均排名和曝光效果指标
      tags:
        - Dashboard
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/TeamBindingId"
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/BeginDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/TitleIds"
        - $ref: "#/components/parameters/Platforms"
        - $ref: "#/components/parameters/TagIds"
      responses:
        "200":
          description: 概览指标
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/answerbit/dashboard/exposure-trends:
    get:
      summary: 获取品牌及竞品每日提及率与平均排名趋势
      tags:
        - Dashboard
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/TeamBindingId"
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/BeginDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/TitleIds"
        - $ref: "#/components/parameters/CompetitorIds"
        - $ref: "#/components/parameters/Platforms"
        - $ref: "#/components/parameters/TagIds"
      responses:
        "200":
          description: 提及率趋势
  /v1/answerbit/dashboard/score-trends:
    get:
      summary: 获取品牌及竞品每日曝光效果趋势
      tags:
        - Dashboard
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/TeamBindingId"
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/BeginDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/CompetitorIds"
      responses:
        "200":
          description: 曝光效果趋势
  /v1/answerbit/dashboard/exposure-rank:
    get:
      summary: 获取品牌与竞品提及率对比排行
      tags:
        - Dashboard
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/TeamBindingId"
        - $ref: "#/components/parameters/BrandId"
        - $ref: "#/components/parameters/BeginDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/CompetitorIds"
      responses:
        "200":
          description: 提及率与平均排名对比
  /v1/answerbit/dashboard/score-rank:
    get:
