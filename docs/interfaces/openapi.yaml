      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingTierRule"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 等级价格规则已更新
  /v1/publication-channels:
    get:
      summary: 查询可用人民币计费发布渠道
      description: 仅读取本地缓存并分页返回；价格按当前登录用户等级解析，翻页、搜索和排序不会触发上游目录刷新。
      tags:
        - Publications
      security: *id001
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [website, wemedia, manual]
        - in: query
          name: maxPriceAmount
          description: 最高人民币分价格
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
        - in: query
          name: sort
          schema:
            type: string
            enum: [recommended, priceAsc, rateDesc, speedAsc]
            default: recommended
      responses:
        "200":
          description: 分页的有效渠道及人民币分价格
  /v1/publication-channels/{channelId}:
    get:
      summary: 查询单个可用人民币计费发布渠道
      description: 仅返回当前登录用户等级可见且仍可下单的渠道，并解析该用户的最终人民币分售价。
      tags:
        - Publications
      security: *id001
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 渠道详情及当前用户等级售价
        "401":
          description: 缺少有效 Session
        "404":
          description: 渠道不存在、已下架或对当前用户不可见
        "422":
          description: 平台腾讯接入尚未完成
  /v1/publication-orders:
    get:
      summary: 查询企业或品牌发布单
      description: 默认分页读取 20 条，最多 100 条。按创建时间和订单 ID 倒序排列；越界页码返回实际末页，空列表返回第 1 页。品牌与内部团队绑定须同时提供。当前授权页面同步上游状态后重新读取结果。
      tags:
        - Publications
      security: *id001
      parameters:
        - *id002
        - *id003
        - *id004
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: keyword
          in: query
          description: 标题、媒体名称或订单编号的文字匹配，百分号和下划线按普通字符匹配
          schema:
            type: string
            maxLength: 255
            default: ""
        - name: status
          in: query
          schema:
            type: string
            enum: [submitted, processing, published, failed, cancelled]
        - name: beginDate
          in: query
          description: 北京时间提交日期起点，须与 endDate 同时提供且不晚于 endDate
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: 北京时间提交日期终点，包含当天，须与 beginDate 同时提供
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 当前范围的发布单分页列表
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination, requestId]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [order, channel]
                      properties:
                        order:
                          type: object
                        channel:
                          type: object
                  pagination:
                    type: object
                    required: [page, pageSize, total, pages]
                    properties:
                      page:
                        type: integer
                        minimum: 1
                      pageSize:
                        type: integer
                        minimum: 1
                        maximum: 100
                      total:
                        type: integer
                        minimum: 0
                      pages:
                        type: integer
                        minimum: 0
                  requestId:
                    type: string
        "400":
          description: 范围、页码、状态或日期参数无效
        "403":
          description: 无企业或品牌发布查询权限
    post:
      summary: 提交人民币余额计费发布单
      description: 按渠道价格快照从品牌 publication_cny 余额扣减；免费渠道不生成零元流水。相同幂等键返回已有订单；失败或取消时原路返还。
      tags:
        - Publications
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicationOrder"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 已提交并扣减品牌发布余额
        "200":
          description: 幂等重放
        "409":
          description: 同一幂等键对应不同品牌、渠道、标题、操作用户、来源任务或来源链接
        "422":
          description: 品牌发布余额不足、正文缺失或来源任务尚未完成
        "503":
          description: 媒体发布平台发布余额明确不足，未创建订单且未扣品牌余额
        "502":
          description: 聚合发布上游明确拒绝或请求结果不确定
        "504":
          description: 聚合发布上游超时且结果不确定
  /v1/publication-orders/{orderId}/tracking-source:
    get:
      summary: 读取已发布订单的效果追踪来源
      description: 同时校验 publication.read 与 resource.create 权限及品牌归属，只返回已发布订单的标题和 HTTP(S) 结果链接，不创建追踪或扣积分。
      tags:
        - Publications
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/TeamBindingId"
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: 可用于追踪表单的已发布内容
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PublicationTrackingSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: PUBLICATION_ORDER_NOT_FOUND，订单不存在或不属于当前企业与品牌
        "409":
          description: PUBLICATION_ORDER_NOT_PUBLISHED，订单尚未发布或已退稿
        "422":
          description: PUBLICATION_RESULT_URL_UNAVAILABLE，缺少有效的公开发布链接
  /v1/publication-orders/{orderId}/cancel:
    post:
      summary: 取消发布订单
      description: 聚合渠道先请求上游取消；成功后本地进入 cancelled 并幂等返还发布余额。
      tags:
        - Publications
      security: *id001
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationOrderAction"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 订单已取消并返还余额
        "409":
          description: 当前状态不允许取消、上游订单号尚未确认，或 PUBLICATION_ACTION_RECONCILIATION_REQUIRED 已有操作待核对；details.action 返回原操作
        "422":
          description: FROG_PUBLICATION_CANCEL_REJECTED，上游明确拒绝取消，订单与余额保持不变
        "502":
          description: FROG_PUBLICATION_CANCEL_FAILED，取消结果未确认，先核对订单状态
        "504":
          description: 上游取消请求超时，结果未确认，先核对订单状态
  /v1/publication-orders/{orderId}/appeal:
    post:
      summary: 提交聚合发布订单申诉
      tags:
        - Publications
      security: *id001
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealPublicationOrder"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 申诉已提交到聚合发布上游，已有售后状态时返回原订单
        "409":
          description: 当前状态不允许申诉，或 PUBLICATION_ACTION_RECONCILIATION_REQUIRED 已有操作待核对；details.action 返回原操作
        "422":
          description: 当前订单不支持聚合发布申诉，或 FROG_PUBLICATION_APPEAL_REJECTED 上游明确拒绝申诉
        "502":
          description: FROG_PUBLICATION_APPEAL_FAILED，申诉结果未确认，先核对订单状态
        "504":
          description: 上游申诉请求超时，结果未确认，先核对订单状态
  /v1/publication-orders/{orderId}/action-resolution:
    post:
      summary: 核对上游后结束待确认的发布操作
      description: 要求 publication.create 与品牌范围；仅解除已不确定或超过两分钟执行期限的原操作，保存核对说明和审计，不重发、不退款。原操作 ID 变化返回冲突，重复解除返回原结果。
      tags: [Publications]
      security: *id001
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolvePublicationAction"
      responses:
        "200": { description: 原操作已结束；订单与余额保持当前实际状态 }
        "400": { description: VALIDATION_ERROR，核对参数或说明有误 }
        "403": { description: 当前用户没有发布操作权限或品牌范围 }
        "404": { description: 发布订单在当前范围不存在 }
        "409":
          {
            description: PUBLICATION_ACTION_IN_PROGRESS 原操作仍在执行，或 PUBLICATION_ACTION_CONFLICT 操作 ID 已变化,
          }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /v1/admin/publication-provider-configuration:
    get:
      summary: 查询媒体发布平台统一接入配置
      description: 只返回 Key 掩码和配置状态，不返回明文或密文。
      tags:
        - Platform Publications
      security: *id001
      responses:
        "200":
          description: 媒体发布平台配置状态
    put:
      summary: 验证并保存媒体发布平台 API Key
      description: 保存前调用上游余额，以及网站媒体、自媒体的目录、分类和订单查询接口校验；全部成功后使用 APP_ENCRYPTION_KEY 加密存储并供 Web 与 Worker 共用。
      tags:
        - Platform Publications
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPublicationProviderConfiguration"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 配置已验证并加密保存
        "422":
          description: API 地址或 Key 的上游校验未通过
  /v1/admin/publication-provider-balance:
    get:
      summary: 查询媒体发布平台账户余额与接口算力
      description: 仅平台发布管理员可见；上游查询异常以 available=false 返回，不影响本地账本和履约数据。
      tags:
        - Platform Publications
      security: *id001
      responses:
        "200":
          description: 媒体发布平台账户状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - requestId
                properties:
                  data:
                    $ref: "#/components/schemas/PublicationProviderBalance"
                  requestId:
                    type: string
  /v1/admin/publication-channels:
    get:
      summary: 平台管理员查询全部发布渠道
      description: 分页读取本地缓存，不触发上游目录刷新。
      tags:
        - Platform Publications
      security: *id001
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
        - in: query
          name: provider
          schema:
            type: string
            enum: [frog_media, manual]
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [website, wemedia, manual]
        - in: query
          name: category
          schema:
            type: string
            maxLength: 100
        - in: query
          name: sort
          schema:
            type: string
            enum: [recommended, priceAsc, rateDesc, speedAsc]
            default: recommended
      responses:
        "200":
          description: 分页的发布渠道
    post:
      summary: 平台管理员创建人民币计费发布渠道
      tags:
        - Platform Publications
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicationChannel"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 渠道已创建
  /v1/admin/publication-orders:
    get:
      summary: 平台管理员分页查询发布履约单
      description: 需要 platform.publication.manage，仅查询本地履约记录，不在读取中调用上游。分页总数与结果来自同一只读快照，创建时间与订单 ID 倒序，越界页码回退实际末页。
      tags:
        - Platform Publications
      security: *id001
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: organizationId
          schema: { type: string, format: uuid }
        - in: query
          name: q
          description: 标题、媒体、企业名称、品牌 ID、本地或上游订单号的文字检索，百分号和下划线按普通字符匹配
          schema: { type: string, maxLength: 255, default: "" }
        - in: query
          name: provider
          schema: { type: string, enum: [manual, frog_media] }
        - in: query
          name: status
          schema:
            {
              type: string,
              enum: [submitted, processing, published, failed, cancelled],
            }
        - in: query
          name: beginDate
          description: 北京时间起始提交日期，须与 endDate 成对提供，且不晚于 endDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          description: 北京时间结束提交日期，包含当天，须与 beginDate 成对提供
          schema: { type: string, format: date }
      responses:
        "200":
          description: data 包含 list 与 pagination，每行包含 order、channel、organization，包含企业名称和原订单价格快照
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [list, pagination]
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          required: [order, channel, organization]
                          properties:
                            order: { type: object }
                            channel: { type: object }
                            organization:
                              type: object
                              required: [id, name]
                              properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                      pagination:
                        type: object
                        required: [page, pageSize, total, pages]
                        properties:
                          page: { type: integer, minimum: 1 }
                          pageSize: { type: integer, minimum: 1, maximum: 100 }
                          total: { type: integer, minimum: 0 }
                          pages: { type: integer, minimum: 0 }
                  requestId: { type: string }
        "400":
          description: 查询参数无效
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/publication-orders/{orderId}:
    get:
      summary: 平台管理员核对单笔发布订单
      description: 需要 platform.publication.manage，只读返回订单、渠道与所属企业，不同步上游、写入或返还余额。
      tags:
        - Platform Publications
      security: *id001
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 单笔 order、channel 与 organization，可用于写入响应丢失后的结果核对
        "400":
          description: 订单编号不是有效 UUID
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: PUBLICATION_ORDER_NOT_FOUND
    patch:
      summary: 平台管理员处理人工渠道发布单状态
      description: 聚合渠道由上游自动履约同步，此入口返回 PUBLICATION_ORDER_UPSTREAM_MANAGED。
      tags:
        - Platform Publications
      security: *id001
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePublicationOrder"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 状态已更新
        "409":
          description: 状态流转冲突，或聚合订单须由上游驱动履约
        "422":
          description: 发布完成缺少结果链接
  /v1/admin/organization-balances:
    get:
      summary: 分页查询企业资金池与品牌余额
      description: 要求 platform.balance.manage。只返回存在 Tencent BrandID 映射且未关闭的企业投影及双余额；账户、目录和总数使用同一快照，未建立账户显示零。支持企业/品牌名称、BrandID、企业编号与内部标识搜索；列表和总数使用平台角色的同一只读快照，按接入时间和企业 ID 倒序排列，越界页码回退有效末页。
      tags:
        - Platform Balances
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          description: 企业/品牌名称、BrandID、企业 UUID 或内部标识；按原文匹配，最长 200 字符
          schema:
            type: string
            maxLength: 200
        - in: query
          name: status
          description: 原始手动状态；active 包含服务已到期但未手动冻结的企业
          schema:
            type: string
            enum:
              - active
              - suspended
        - in: query
          name: accessState
          description: 实际服务状态；active 为服务有效或无期限，suspended 为手动冻结，expired 为未手动冻结且服务到期
          schema:
            type: string
            enum: [active, suspended, expired]
      responses:
        "200":
          description: 腾讯企业分页列表；accessState 与 pointsExpired 按服务端快照时间计算，积分到期不改变企业服务状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  data:
                    type: object
                    required: [list, pagination]
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            answerbitBrandId:
                              type: string
                            answerbitBrandName:
                              type: string
                            status:
                              type: string
                              enum: [active, suspended]
                            accessState:
                              type: string
                              enum: [active, suspended, expired]
                            pointsExpired:
                              type: boolean
                            serviceExpiresAt:
                              type: string
                              format: date-time
                              nullable: true
                            pointsExpiresAt:
                              type: string
                              format: date-time
                              nullable: true
                            memberCount:
                              type: integer
                              minimum: 0
                            balances:
                              type: object
                              required:
                                [
                                  enterprisePoints,
                                  enterprisePublicationCny,
                                  brandPoints,
                                  brandPublicationCny,
                                ]
                              properties:
                                enterprisePoints:
                                  {
                                    type: integer,
                                    minimum: 0,
                                    description: 企业资金池积分,
                                  }
                                enterprisePublicationCny:
                                  {
                                    type: integer,
                                    minimum: 0,
                                    description: 企业资金池人民币分,
                                  }
                                brandPoints:
                                  {
                                    type: integer,
                                    minimum: 0,
                                    description: 当前映射品牌积分,
                                  }
                                brandPublicationCny:
                                  {
                                    type: integer,
                                    minimum: 0,
                                    description: 当前映射品牌人民币分,
                                  }
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            minimum: 1
                            description: 实际页码；超界回退有效末页，空结果为 1
                          pageSize:
                            type: integer
                            minimum: 1
                            maximum: 100
                          total:
                            type: integer
                            minimum: 0
                          pages:
                            type: integer
                            minimum: 0
        "400":
          description: VALIDATION_ERROR；分页、文字长度或筛选值无效
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/balances:
    get:
      summary: 平台管理员查询全部企业与品牌余额账户
      tags:
        - Platform Balances
      security:
        - cookieSession: []
      responses:
        "200":
          description: 全平台双余额账户列表
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/balance-transactions:
    get:
      summary: 平台管理员分页查询用户积分与余额流水
      description: 可跨企业按企业、操作用户、资产和流水操作筛选；结果包含企业名称、用户名称和账号及 sourceBrandId/targetBrandId（null 为企业资金池）。列表和总数使用平台角色同一只读快照，按创建时间和流水 ID 倒序排序，超界页码回退有效末页；已关闭企业的历史仍可查询。
      tags:
        - Platform Balances
      security:
        - cookieSession: []
      parameters:
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: userId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: asset
          required: false
          schema:
            type: string
            enum:
              - answerbit_points
              - publication_cny
        - in: query
          name: operation
          required: false
          schema:
            type: string
            enum:
              - grant
              - allocate
              - consume
              - restore
              - adjust
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 分页用户积分与余额流水
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/balance-transactions/confirmation:
    get:
      summary: 平台管理员按原请求核对资产调整结果
      description: 要求 platform.balance.manage，等待同企业同幂等键的在途账本事务完成，只读返回原流水或 null，不产生扣款或入账。
      tags:
        - Platform Balances
      security: *id001
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: idempotencyKey
          required: true
          schema:
            {
              type: string,
              minLength: 8,
              maxLength: 128,
              pattern: "^[A-Za-z0-9._:-]+$",
            }
      responses:
        "200":
          description: 原请求对应流水，未查到时 data 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      organizationId: { type: string, format: uuid }
                      brandId: { type: string, nullable: true }
                      asset:
                        {
                          type: string,
                          enum: [answerbit_points, publication_cny],
                        }
                      operation:
                        {
                          type: string,
                          enum: [grant, allocate, consume, restore, adjust],
                        }
                      referenceType: { type: string }
                      idempotencyKey: { type: string }
                      actorUserId: { type: string, nullable: true }
                      amount: { type: integer }
                      reason: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/publication-channels/{channelId}:
    patch:
      summary: 平台管理员调整人工或媒体发布渠道的分级售价及平台上下架
      tags:
        - Platform Publications
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePublicationChannel"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: 渠道已更新
        "404":
          description: 渠道不存在
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  headers:
    NoStore:
      description: API 响应禁止由浏览器或中间代理缓存
      schema:
        type: string
        const: no-store, max-age=0
    RetryAfter:
      description: 客户端再次发起请求前应等待的秒数
      schema:
        type: string
        pattern: "^[0-9]+$"
    RequestId:
      description: 与响应体、结构化日志及上游调用一致的请求关联标识
      schema:
        type: string
        minLength: 1
  schemas:
    PurchaseAnswerBitQuota:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - teamBindingId
        - quotaType
        - quotaAmount
      properties:
        organizationId:
          type: string
          format: uuid
        teamBindingId:
          type: string
          format: uuid
        brandId:
          type: string
          minLength: 1
          maxLength: 128
        quotaType:
          type: string
          const: max_brand
        quotaAmount:
          type: integer
          minimum: 1
          maximum: 9999
    AgentQuota:
      type: object
      additionalProperties: false
      required:
        - enterpriseLimit
        - brandLimit
        - answerbitPointsLimit
      properties:
        enterpriseLimit:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100000
          description: 可管理的企业数量上限
        brandLimit:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100000
          description: 可创建的品牌数量上限
        answerbitPointsLimit:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 1000000000
          description: 可从企业池划拨的腾讯积分累计上限
    OrganizationFeatureScope:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - features
      properties:
        organizationId:
          type: string
          format: uuid
        features:
          type: array
          uniqueItems: true
          maxItems: 8
          description: 空数组表示关闭该用户在目标企业的全部业务功能；未建立范围记录时继承角色默认能力
          items:
            type: string
            enum:
              - geo_insights
              - content
              - publication
              - balance
              - report
              - notification
              - member_management
              - enterprise_settings
    TencentEnterpriseSyncEnvelope:
      type: object
      required:
        - data
        - requestId
      properties:
        requestId:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
            - brandCount
            - createdEnterpriseCount
            - updatedEnterpriseCount
            - closedEnterpriseCount
            - pendingMissingCount
            - syncedAt
          properties:
            brandCount:
              type: integer
              minimum: 0
            createdEnterpriseCount:
              type: integer
              minimum: 0
            updatedEnterpriseCount:
              type: integer
              minimum: 0
            closedEnterpriseCount:
              type: integer
              minimum: 0
            pendingMissingCount:
              type: integer
              minimum: 0
            syncedAt:
              type: string
              format: date-time
    PlatformAnswerBitConfigurationEnvelope:
      type: object
      required:
        - data
        - requestId
      properties:
        requestId:
          type: string
        data:
          type: object
          required:
            - configured
            - status
            - teamId
            - apiKeyHint
            - keyVersion
            - permissions
            - operations
            - brands
            - summary
            - lastCheckedAt
            - lastSyncedAt
            - updatedAt
          properties:
            configured:
              type: boolean
            status:
              type: string
              enum:
                - missing
                - active
                - invalid
                - disabled
            teamId:
              type:
                - string
                - "null"
            apiKeyHint:
              type:
                - string
                - "null"
            keyVersion:
              type: integer
            permissions:
              type: array
              description: 兼容字段；由系统自动返回全部已接入 operation，不表示本地权限裁剪
              items:
                type: string
            operations:
              type: array
              description: 系统直接接入的 AnswerBit operation 目录
              items:
                type: string
            lastCheckedAt:
              type:
                - string
                - "null"
              format: date-time
            lastSyncedAt:
              type:
                - string
                - "null"
              format: date-time
            updatedAt:
              type:
                - string
                - "null"
              format: date-time
            brands:
              type: array
              items:
                type: object
                required:
                  - id
                  - brandId
                  - brandName
                  - syncedAt
                  - organizationId
                  - organizationName
                properties:
                  id:
                    type: string
                    format: uuid
                  brandId:
                    type: string
                  brandName:
                    type: string
                  syncedAt:
                    type: string
                    format: date-time
                  organizationId:
                    type:
                      - string
                      - "null"
                    format: uuid
                  organizationName:
                    type:
                      - string
                      - "null"
            summary:
              type: object
              required:
                - brandCount
                - assignedBrandCount
                - availableBrandCount
              properties:
                brandCount:
                  type: integer
                assignedBrandCount:
                  type: integer
                availableBrandCount:
                  type: integer
    CreateAnswerBitCredential:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - teamId
        - scopeType
        - permissions
        - apiKey
      properties:
        organizationId:
          type: string
          format: uuid
        teamId:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 128
          description: Key 的平台内显示名称，不修改腾讯团队名称
        scopeType:
          type: string
          enum:
            - team
            - brand
        brandId:
          type: string
          minLength: 1
          maxLength: 128
          description: scopeType 为 brand 时必填，team 时不得填写
        brandName:
          type: string
          minLength: 1
          maxLength: 255
        permissions:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^/geo/
        priority:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        apiKey:
          type: string
          format: password
          minLength: 16
          maxLength: 512
          writeOnly: true
    UpdateAnswerBitCredential:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type:
            - string
            - "null"
          maxLength: 128
        permissions:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^/geo/
        priority:
          type: integer
          minimum: 1
          maximum: 1000
        status:
          type: string
          enum:
            - active
            - disabled
        apiKey:
          type: string
          format: password
          minLength: 16
          maxLength: 512
          writeOnly: true
    TenantAnswerBitConfiguration:
      type: object
      additionalProperties: false
      required:
        - configured
        - status
        - credentialCount
        - activeCredentialCount
        - enterpriseConnected
        - brand
        - lastCheckedAt
        - lastSyncedAt
        - updatedAt
      properties:
        configured:
          type: boolean
        status:
          type: string
          enum:
            - missing
            - active
            - invalid
            - disabled
        credentialCount:
          type: integer
          minimum: 0
          maximum: 1
        activeCredentialCount:
          type: integer
          minimum: 0
          maximum: 1
        enterpriseConnected:
          type: boolean
        brand:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - brandId
                - brandName
                - syncedAt
              properties:
                brandId:
                  type: string
                brandName:
                  type: string
                syncedAt:
                  type: string
                  format: date-time
            - type: "null"
        lastCheckedAt:
          type:
            - string
            - "null"
          format: date-time
        lastSyncedAt:
          type:
            - string
            - "null"
          format: date-time
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    AdminOrganizationMember:
      type: object
      additionalProperties: false
      required:
        - userId
        - role
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - tenant_admin
            - brand_admin
            - brand_editor
            - brand_viewer
    SavedViewExpected:
      type: object
      additionalProperties: false
      required:
        - name
        - filters
        - isDefault
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        filters:
          type: object
          maxProperties: 50
        isDefault:
          type: boolean
    CreateSavedView:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - name
        - page
        - filters
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        page:
          type: string
          enum:
            - dashboard
            - monitoring
            - answers
            - content
            - metering
        filters:
          type: object
          maxProperties: 50
          description: answers 页仅接受 teamBindingId、brandId、beginDate、endDate、platforms、兼容字段 platform、keyword 和字符串 mentionBrand（-1、0、1）；日期必须有效且开始不晚于结束。品牌必须属于当前企业并通过 GEO 权限检查，遗漏 teamBindingId 时服务端从品牌绑定补全。
        isDefault:
          type: boolean
          default: false
    CreateReportExport:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - teamBindingId
        - brandId
        - reportType
        - beginDate
        - endDate
      properties:
        organizationId:
          type: string
          format: uuid
        teamBindingId:
          type: string
          format: uuid
        brandId:
          type: string
          maxLength: 128
        reportType:
          type: string
          enum:
            - answers
            - domain_rank
            - article_rank
        beginDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        titleIds:
          type: array
          maxItems: 100
          items:
            type: string
        promptIds:
          type: array
          maxItems: 100
          items:
            type: string
        platforms:
          type: array
          maxItems: 100
          items:
            type: string
        tagIds:
          type: array
          maxItems: 100
          items:
            type: string
        keyword:
          type: string
          maxLength: 500
        mentionBrand:
          type: integer
          enum: [-1, 0, 1]
          default: -1
          description: 回答报表的品牌提及筛选；-1 全部、0 未提及、1 已提及
    NotificationRuleInput:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - organizationId
            - teamBindingId
            - type
            - threshold
          properties:
            organizationId:
              type: string
              format: uuid
            teamBindingId:
              type: string
              format: uuid
            type:
              const: low_credits
            threshold:
              type: integer
              minimum: 0
              maximum: 1000000000
            cooldownMinutes:
              type: integer
              minimum: 5
              maximum: 10080
              default: 1440
            enabled:
              type: boolean
              default: true
        - type: object
          additionalProperties: false
          required:
            - organizationId
            - teamBindingId
            - type
            - threshold
          properties:
            organizationId:
              type: string
              format: uuid
            teamBindingId:
              type: string
              format: uuid
            type:
              const: connection_failure
            threshold:
              type: integer
              minimum: 1
              maximum: 20
            cooldownMinutes:
              type: integer
              minimum: 5
              maximum: 10080
              default: 1440
            enabled:
              type: boolean
              default: true
        - type: object
          additionalProperties: false
          required:
            - organizationId
            - teamBindingId
            - brandId
            - type
            - metric
            - threshold
          properties:
            organizationId:
              type: string
              format: uuid
            teamBindingId:
              type: string
              format: uuid
            brandId:
              type: string
              minLength: 1
              maxLength: 128
            type:
              const: metric_anomaly
            metric:
              type: string
              enum:
                - exposure
                - score
                - avg_rank
            threshold:
              type: integer
              minimum: 1
              maximum: 100
            windowDays:
              type: integer
              minimum: 1
              maximum: 90
              default: 7
            cooldownMinutes:
              type: integer
              minimum: 5
              maximum: 10080
              default: 1440
            enabled:
              type: boolean
              default: true
    NotificationRuleReplaceInput:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - organizationId
            - teamBindingId
            - type
            - threshold
            - expected
          properties:
            expected:
              $ref: "#/components/schemas/NotificationRuleInput"
            organizationId:
              type: string
              format: uuid
            teamBindingId:
              type: string
              format: uuid
            type:
              const: low_credits
            threshold:
              type: integer
              minimum: 0
              maximum: 1000000000
            cooldownMinutes:
              type: integer
              minimum: 5
              maximum: 10080
              default: 1440
            enabled:
              type: boolean
              default: true
        - type: object
          additionalProperties: false
          required:
            - organizationId
            - teamBindingId
            - type
            - threshold
            - expected
          properties:
            expected:
              $ref: "#/components/schemas/NotificationRuleInput"
            organizationId:
              type: string
              format: uuid
            teamBindingId:
              type: string
              format: uuid
            type:
              const: connection_failure
            threshold:
              type: integer
              minimum: 1
              maximum: 20
            cooldownMinutes:
              type: integer
              minimum: 5
              maximum: 10080
              default: 1440
            enabled:
              type: boolean
              default: true
        - type: object
          additionalProperties: false
          required:
            - organizationId
            - teamBindingId
            - brandId
            - type
            - metric
            - threshold
            - expected
          properties:
            expected:
              $ref: "#/components/schemas/NotificationRuleInput"
            organizationId:
              type: string
              format: uuid
            teamBindingId:
              type: string
              format: uuid
            brandId:
              type: string
              minLength: 1
              maxLength: 128
            type:
              const: metric_anomaly
            metric:
              type: string
              enum:
                - exposure
                - score
                - avg_rank
            threshold:
              type: integer
              minimum: 1
              maximum: 100
            windowDays:
              type: integer
              minimum: 1
              maximum: 90
              default: 7
            cooldownMinutes:
              type: integer
              minimum: 5
              maximum: 10080
              default: 1440
            enabled:
              type: boolean
              default: true
    NotificationReadAllInput:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
        type:
          type: string
          enum: [low_credits, connection_failure, metric_anomaly]
