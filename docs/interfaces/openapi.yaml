      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantBalance"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 入账成功
        "200":
          description: 幂等重放
        "409":
          description: 幂等键对应的入账参数或操作不一致
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/balance-deductions:
    post:
      summary: 平台管理员给企业手动扣减
      tags:
