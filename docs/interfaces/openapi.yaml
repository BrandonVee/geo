      responses:
        "409":
          description: 幂等键对应的扣减参数不一致
        "422":
          description: 账户余额不足
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 扣减成功
        "200":
          description: 幂等重放
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/feature-point-costs:
    get:
      summary: 查询业务功能积分单价
      tags:
        - Platform Balances
      security: *id001
      responses:
        "200":
