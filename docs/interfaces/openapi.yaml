    post:
      summary: 平台管理员给企业人工入账
      tags:
        - Platform Balances
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantBalance"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: 入账成功
        "200":
          description: 幂等重放
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/feature-point-costs:
    get:
      summary: 查询业务功能积分单价
      tags:
        - Platform Balances
      security: *id001
      responses:
        "200":
          description: 功能积分规则列表
    put:
      summary: 设置业务功能积分单价
      tags:
        - Platform Balances
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeaturePointCost"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 计费规则已更新
  /v1/admin/pricing-tier-rules:
    get:
      summary: 查询普通用户与金银铜代理价格规则
      tags:
        - Platform Balances
        - Platform Publications
      security: *id001
      responses:
        "200":
          description: 四级发布加价率与功能积分计费系数
    put:
      summary: 更新一个客户等级的发布与积分计费规则
      tags:
        - Platform Balances
        - Platform Publications
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingTierRule"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 等级价格规则已更新
  /v1/publication-channels:
    get:
      summary: 查询可用人民币计费发布渠道
      description: 仅读取本地缓存并分页返回；价格按当前登录用户等级解析，翻页、搜索和排序不会触发上游目录刷新。
      tags:
        - Publications
      security: *id001
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [website, wemedia, manual]
        - in: query
          name: maxPriceAmount
          description: 最高人民币分价格
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
        - in: query
          name: sort
          schema:
            type: string
            enum: [recommended, priceAsc, rateDesc, speedAsc]
            default: recommended
      responses:
        "200":
          description: 分页的有效渠道及人民币分价格
  /v1/publication-channels/{channelId}:
    get:
      summary: 查询单个可用人民币计费发布渠道
      description: 仅返回当前登录用户等级可见且仍可下单的渠道，并解析该用户的最终人民币分售价。
      tags:
        - Publications
      security: *id001
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 渠道详情及当前用户等级售价
        "401":
          description: 缺少有效 Session
        "404":
          description: 渠道不存在、已下架或对当前用户不可见
        "422":
          description: 平台腾讯接入尚未完成
  /v1/publication-orders:
    get:
      summary: 查询企业或品牌发布单
      tags:
        - Publications
      security: *id001
      parameters:
        - *id002
        - *id003
        - *id004
      responses:
        "200":
          description: 发布单列表
    post:
      summary: 提交人民币余额计费发布单
      description: 按渠道价格快照从品牌 publication_cny 余额扣减；免费渠道不生成零元流水。相同幂等键返回已有订单；失败或取消时原路返还。
      tags:
        - Publications
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicationOrder"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: 已提交并扣减品牌发布余额
        "200":
          description: 幂等重放
        "409":
          description: 同一幂等键对应不同品牌、渠道、标题、操作用户、来源任务或来源链接
        "422":
          description: 品牌发布余额不足、正文缺失或来源任务尚未完成
        "503":
          description: 小青蛙平台发布余额明确不足，未创建订单且未扣品牌余额
        "502":
          description: 聚合发布上游明确拒绝或请求结果不确定
        "504":
          description: 聚合发布上游超时且结果不确定
  /v1/publication-orders/{orderId}/cancel:
    post:
      summary: 取消发布订单
      description: 聚合渠道先请求上游取消；成功后本地进入 cancelled 并幂等返还发布余额。
      tags:
        - Publications
      security: *id001
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationOrderAction"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 订单已取消并返还余额
        "409":
          description: 当前状态不允许取消，或上游订单号尚未确认
  /v1/publication-orders/{orderId}/appeal:
    post:
      summary: 提交聚合发布订单申诉
      tags:
        - Publications
      security: *id001
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealPublicationOrder"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 申诉已提交到聚合发布上游，已有售后状态时返回原订单
        "409":
          description: 当前状态不允许申诉
        "422":
          description: 当前订单不支持聚合发布申诉
  /v1/admin/publication-provider-configuration:
    get:
      summary: 查询小青蛙平台统一接入配置
      description: 只返回 Key 掩码和配置状态，不返回明文或密文。
      tags:
        - Platform Publications
      security: *id001
      responses:
        "200":
          description: 小青蛙平台配置状态
    put:
      summary: 验证并保存小青蛙平台 API Key
      description: 保存前调用上游余额，以及网站媒体、自媒体的目录、分类和订单查询接口校验；全部成功后使用 APP_ENCRYPTION_KEY 加密存储并供 Web 与 Worker 共用。
      tags:
        - Platform Publications
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPublicationProviderConfiguration"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 配置已验证并加密保存
        "422":
          description: API 地址或 Key 的上游校验未通过
  /v1/admin/publication-provider-balance:
    get:
      summary: 查询小青蛙平台账户余额与接口算力
      description: 仅平台发布管理员可见；上游查询异常以 available=false 返回，不影响本地账本和履约数据。
      tags:
        - Platform Publications
      security: *id001
      responses:
        "200":
          description: 小青蛙平台账户状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - requestId
                properties:
                  data:
                    $ref: "#/components/schemas/PublicationProviderBalance"
                  requestId:
                    type: string
  /v1/admin/publication-channels:
    get:
      summary: 平台管理员查询全部发布渠道
      description: 分页读取本地缓存，不触发上游目录刷新。
      tags:
        - Platform Publications
      security: *id001
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
        - in: query
          name: provider
          schema:
            type: string
            enum: [frog_media, manual]
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [website, wemedia, manual]
        - in: query
          name: category
          schema:
            type: string
            maxLength: 100
        - in: query
          name: sort
          schema:
            type: string
            enum: [recommended, priceAsc, rateDesc, speedAsc]
            default: recommended
      responses:
        "200":
          description: 分页的发布渠道
    post:
      summary: 平台管理员创建人民币计费发布渠道
      tags:
        - Platform Publications
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicationChannel"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: 渠道已创建
  /v1/admin/publication-orders:
    get:
      summary: 平台管理员查询全部发布履约单
      tags:
        - Platform Publications
      security: *id001
      responses:
        "200":
          description: 全平台发布单
  /v1/admin/publication-orders/{orderId}:
    patch:
      summary: 平台管理员处理人工渠道发布单状态
      description: 聚合渠道由上游自动履约同步，此入口返回 PUBLICATION_ORDER_UPSTREAM_MANAGED。
      tags:
        - Platform Publications
      security: *id001
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePublicationOrder"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 状态已更新
        "409":
          description: 状态流转冲突，或聚合订单须由上游驱动履约
        "422":
          description: 发布完成缺少结果链接
  /v1/admin/balances:
    get:
      summary: 平台管理员查询全部企业与品牌余额账户
      tags:
        - Platform Balances
      security:
        - cookieSession: []
      responses:
        "200":
          description: 全平台双余额账户列表
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/balance-transactions:
    get:
      summary: 平台管理员分页查询用户积分与余额流水
      description: 可跨企业按企业、操作用户、资产和流水操作筛选；结果包含企业名称及用户名称和账号。
      tags:
        - Platform Balances
      security:
        - cookieSession: []
      parameters:
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: userId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: asset
          required: false
          schema:
            type: string
            enum:
              - answerbit_points
              - publication_cny
        - in: query
          name: operation
          required: false
          schema:
            type: string
            enum:
              - grant
              - allocate
              - consume
              - restore
              - adjust
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 分页用户积分与余额流水
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/publication-channels/{channelId}:
    patch:
      summary: 平台管理员调整人工或小青蛙渠道的分级售价及平台上下架
      tags:
        - Platform Publications
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePublicationChannel"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 渠道已更新
        "404":
          description: 渠道不存在
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  headers:
    NoStore:
      description: API 响应禁止由浏览器或中间代理缓存
      schema:
        type: string
        const: no-store, max-age=0
    RetryAfter:
      description: 客户端再次发起请求前应等待的秒数
      schema:
        type: string
        pattern: "^[0-9]+$"
    RequestId:
      description: 与响应体、结构化日志及上游调用一致的请求关联标识
      schema:
        type: string
        minLength: 1
  schemas:
    PurchaseAnswerBitQuota:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - teamBindingId
        - quotaType
        - quotaAmount
      properties:
        organizationId:
          type: string
          format: uuid
        teamBindingId:
          type: string
          format: uuid
        brandId:
          type: string
          minLength: 1
          maxLength: 128
        quotaType:
          type: string
          const: max_brand
        quotaAmount:
          type: integer
          minimum: 1
          maximum: 9999
    AgentQuota:
      type: object
      additionalProperties: false
      required:
        - enterpriseLimit
        - brandLimit
        - answerbitPointsLimit
      properties:
        enterpriseLimit:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100000
          description: 可管理的企业数量上限
        brandLimit:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100000
          description: 可创建的品牌数量上限
        answerbitPointsLimit:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 1000000000
          description: 可从企业池划拨的腾讯积分累计上限
    OrganizationFeatureScope:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - features
      properties:
        organizationId:
          type: string
          format: uuid
        features:
          type: array
          uniqueItems: true
          maxItems: 8
          description: 空数组表示关闭该用户在目标企业的全部业务功能；未建立范围记录时继承角色默认能力
          items:
            type: string
            enum:
              - geo_insights
              - content
              - publication
              - balance
              - report
              - notification
              - member_management
              - enterprise_settings
    TencentEnterpriseSyncEnvelope:
      type: object
      required:
        - data
        - requestId
      properties:
        requestId:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
            - brandCount
            - createdEnterpriseCount
            - updatedEnterpriseCount
            - closedEnterpriseCount
            - pendingMissingCount
            - syncedAt
          properties:
            brandCount:
              type: integer
              minimum: 0
            createdEnterpriseCount:
              type: integer
              minimum: 0
            updatedEnterpriseCount:
              type: integer
              minimum: 0
            closedEnterpriseCount:
              type: integer
              minimum: 0
            pendingMissingCount:
              type: integer
              minimum: 0
            syncedAt:
              type: string
              format: date-time
    PlatformAnswerBitConfigurationEnvelope:
      type: object
      required:
        - data
        - requestId
      properties:
        requestId:
          type: string
        data:
          type: object
          required:
            - configured
            - status
            - teamId
            - apiKeyHint
            - keyVersion
            - permissions
            - operations
            - brands
            - summary
            - lastCheckedAt
            - lastSyncedAt
            - updatedAt
          properties:
            configured:
              type: boolean
            status:
              type: string
              enum:
                - missing
                - active
                - invalid
                - disabled
            teamId:
              type:
                - string
                - "null"
            apiKeyHint:
              type:
                - string
                - "null"
            keyVersion:
              type: integer
            permissions:
              type: array
              description: 兼容字段；由系统自动返回全部已接入 operation，不表示本地权限裁剪
              items:
                type: string
            operations:
              type: array
              description: 系统直接接入的 AnswerBit operation 目录
              items:
                type: string
            lastCheckedAt:
              type:
                - string
                - "null"
              format: date-time
            lastSyncedAt:
              type:
                - string
                - "null"
              format: date-time
            updatedAt:
              type:
                - string
                - "null"
              format: date-time
            brands:
              type: array
              items:
                type: object
                required:
                  - id
                  - brandId
                  - brandName
                  - syncedAt
                  - organizationId
                  - organizationName
                properties:
                  id:
                    type: string
                    format: uuid
                  brandId:
                    type: string
                  brandName:
                    type: string
                  syncedAt:
                    type: string
                    format: date-time
                  organizationId:
                    type:
                      - string
                      - "null"
                    format: uuid
                  organizationName:
                    type:
                      - string
                      - "null"
            summary:
              type: object
              required:
                - brandCount
                - assignedBrandCount
                - availableBrandCount
              properties:
                brandCount:
                  type: integer
                assignedBrandCount:
                  type: integer
                availableBrandCount:
                  type: integer
    CreateAnswerBitCredential:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - teamId
        - scopeType
        - permissions
        - apiKey
      properties:
        organizationId:
          type: string
          format: uuid
        teamId:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 128
          description: Key 的平台内显示名称，不修改腾讯团队名称
        scopeType:
          type: string
          enum:
            - team
            - brand
        brandId:
          type: string
          minLength: 1
          maxLength: 128
          description: scopeType 为 brand 时必填，team 时不得填写
        brandName:
          type: string
          minLength: 1
          maxLength: 255
        permissions:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^/geo/
        priority:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        apiKey:
          type: string
          format: password
          minLength: 16
          maxLength: 512
          writeOnly: true
    UpdateAnswerBitCredential:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type:
            - string
            - "null"
          maxLength: 128
        permissions:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^/geo/
        priority:
          type: integer
          minimum: 1
          maximum: 1000
        status:
          type: string
          enum:
            - active
            - disabled
        apiKey:
          type: string
          format: password
          minLength: 16
          maxLength: 512
          writeOnly: true
    TenantAnswerBitConfiguration:
      type: object
      additionalProperties: false
      required:
        - configured
        - status
        - credentialCount
        - activeCredentialCount
        - enterpriseConnected
        - brand
        - lastCheckedAt
        - lastSyncedAt
        - updatedAt
      properties:
        configured:
          type: boolean
        status:
          type: string
          enum:
            - missing
            - active
            - invalid
            - disabled
        credentialCount:
          type: integer
          minimum: 0
          maximum: 1
        activeCredentialCount:
          type: integer
          minimum: 0
          maximum: 1
        enterpriseConnected:
          type: boolean
        brand:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - brandId
                - brandName
                - syncedAt
              properties:
                brandId:
                  type: string
                brandName:
                  type: string
                syncedAt:
                  type: string
                  format: date-time
            - type: "null"
        lastCheckedAt:
          type:
            - string
            - "null"
          format: date-time
        lastSyncedAt:
          type:
            - string
            - "null"
          format: date-time
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    AdminOrganizationMember:
      type: object
      additionalProperties: false
      required:
        - userId
        - role
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - tenant_admin
            - brand_admin
            - brand_editor
            - brand_viewer
    CreateSavedView:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - name
        - page
        - filters
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        page:
          type: string
          enum:
            - dashboard
            - monitoring
            - answers
            - content
            - metering
        filters:
          type: object
          maxProperties: 50
        isDefault:
          type: boolean
          default: false
    CreateReportExport:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - teamBindingId
