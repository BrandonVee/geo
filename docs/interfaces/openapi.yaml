                  format: uuid
                teamBindingId:
                  type: string
                  format: uuid
                brandId:
                  type: string
                  maxLength: 128
                promptIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "204":
          description: 批量删除成功
