  /v1/admin/users:
    get:
      summary: 分页查询全平台用户
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - disabled
              - scheduled
              - expired
        - in: query
          name: accountType
          description: 按平台账户类型筛选
          schema:
            type: string
            enum:
              - admin
              - agent
              - customer
      responses:
        "200":
          description: 用户分页列表
    post:
      summary: 人工创建管理员、代理或客户账户
      description: 创建账号和 scrypt 密码凭据；管理员账户会自动授予全局平台管理员角色。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - username
                - password
                - accountType
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                username:
                  type: string
                  pattern: ^[a-z][a-z0-9_]{2,31}$
                  example: east_agent
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
                accountType:
                  type: string
                  enum:
                    - admin
                    - agent
                    - customer
                pricingTier:
                  type: string
                  description: 仅代理商可设置；未提供时默认铜牌代理
                  enum:
                    - bronze
                    - silver
                    - gold
                agentValidFrom:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: 代理商生效时间；留空表示立即生效
                agentExpiresAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: 代理商到期时间；留空表示长期有效
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: 账户创建成功
        "409":
          description: 账号已存在或管理员角色尚未初始化
  /v1/admin/users/{userId}:
    get:
      summary: 查询用户的企业、品牌权限及代理商额度
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 用户详情、企业成员关系、品牌权限、按企业功能范围及代理商额度用量
        "404":
          description: 用户不存在
    patch:
      summary: 更新用户类型、有效期、代理商额度及目标企业功能范围
      description: 企业功能范围与角色权限取交集，只能收窄而不能提升角色权限；额度仅适用于代理商，null 表示不限，0 表示禁止。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - disabled
                accountType:
                  type: string
                  description: 管理员类型不可切换
                  enum:
                    - agent
                    - customer
                pricingTier:
                  type: string
                  description: 代理商使用金银铜等级；客户固定为普通用户
                  enum:
                    - retail
                    - bronze
                    - silver
                    - gold
                agentValidFrom:
                  type:
                    - string
                    - "null"
                  format: date-time
                agentExpiresAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                agentQuota:
                  $ref: "#/components/schemas/AgentQuota"
                organizationFeatureScopes:
                  type: array
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/OrganizationFeatureScope"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 用户状态、类型、有效期、额度或企业功能范围已更新；类型切换与停用会撤销现有 Session
        "409":
          description: 当前企业管理员或品牌权限与目标账户类型冲突
        "422":
          description: 禁止停用当前管理员自身、有效时间范围无效、非代理商设置额度，或目标企业不属于该用户
  /v1/admin/audit-logs:
    get:
      summary: 查询全平台不可变操作审计
      tags:
        - Platform Admin
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum:
              - success
              - failed
      responses:
        "200":
          description: 审计日志分页列表
  /v1/admin/answerbit-configuration:
    get:
      summary: 查询平台固定 TeamID、统一 Key 及品牌目录
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      responses:
        "200":
          description: 统一接入状态、掩码、系统 operation 目录、品牌目录和企业绑定统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAnswerBitConfigurationEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: 配置或轮换平台固定 TeamID 与统一 AnswerBit Key
      description: 提交前调用腾讯 `/geo/query/brand` 验证 TeamID 与 Key；系统直接使用已接入 OpenAPI，最终授权由腾讯官方控制台管理。TeamID 首次配置后锁定，后续只轮换 Key。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - teamId
                - apiKey
              properties:
                teamId:
                  type: string
                  minLength: 1
                  maxLength: 128
                apiKey:
                  type: string
                  format: password
                  minLength: 16
                  maxLength: 512
                  writeOnly: true
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 统一配置已加密保存，并刷新腾讯目录及自动生成对应平台企业
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: TeamID 已完成首次配置，不允许变更
        "422":
          description: TeamID、Key 或腾讯侧接口验证未通过
  /v1/admin/answerbit-enterprise-syncs:
    post:
      summary: 运维核对腾讯企业目录
      description: 自动同步异常排查时，使用当前固定 TeamID 与统一 Key 调用腾讯 `/geo/query/brand`，同步新增和名称变更；连续两次完整目录缺失的企业投影将被关闭。日常目录一致性由 Worker 自动维护。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      responses:
        "200":
          description: 腾讯目录核对和平台企业投影同步完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TencentEnterpriseSyncEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 同步期间统一腾讯配置发生变化
        "422":
          description: 统一凭证未配置、不可用或腾讯拒绝查询
        "429":
          description: 腾讯 AnswerBit 限流
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "502":
          description: 腾讯服务或响应暂时异常
        "504":
          description: 腾讯目录查询超时
  /v1/admin/answerbit-brands:
    post:
      summary: 在平台固定 TeamID 下新建腾讯企业
      description: 未提供初始化问题和竞品时调用腾讯 `/geo/brand/create`；提供任一初始化列表时使用固定 TeamID 调用 `/geo/brand/bundle/create`。上游成功返回 BrandID 后写入官方目录并自动生成一一对应的平台企业投影。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - brand
              properties:
                brand:
                  type: string
                  minLength: 1
                  maxLength: 255
                alias:
                  type: string
                  maxLength: 255
                  default: ""
                website:
                  oneOf:
                    - const: ""
                    - type: string
                      format: uri
                  default: ""
                description:
                  type: string
                  maxLength: 5000
                  default: ""
                note:
                  type: string
                  maxLength: 2000
                  default: ""
                iconMimeType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/jpg
                    - image/png
                    - image/gif
                    - image/webp
                    - image/svg+xml
                  description: 与 iconData 同时提供
                iconData:
                  type: string
                  maxLength: 2796204
                  pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
                  description: 有效 Base64 图片内容，解码后的原始文件最大 2MB；与 iconMimeType 同时提供
                initialPrompts:
                  type: array
                  default: []
                  description: 创建品牌时一并初始化的监测问题；非空时启用腾讯 bundle 创建接口
                  items:
                    type: string
                    minLength: 1
                    maxLength: 2000
                competitors:
                  type: array
                  default: []
                  description: 创建品牌时一并初始化的竞品；非空时启用腾讯 bundle 创建接口
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 255
                      alias:
                        type: string
                        maxLength: 255
                        default: ""
                      description:
                        type: string
                        maxLength: 5000
                        default: ""
                      website:
                        oneOf:
                          - const: ""
                          - type: string
                            format: uri
                        default: ""
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "201":
          description: 腾讯品牌及对应平台企业已创建，Location 指向返回 BrandID 的平台目录资源
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: 统一凭证未配置、不可用或腾讯拒绝品牌创建
        "429":
          description: 腾讯 AnswerBit 限流
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "502":
          description: 腾讯服务或响应暂时异常
        "504":
          description: 腾讯品牌创建超时
  /v1/admin/answerbit-brands/{brandId}:
    get:
      summary: 查询腾讯品牌的平台目录项
      description: 实时调用腾讯 `/geo/brand/get` 读取官方品牌资料，并合并对应平台企业投影。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: brandId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: 腾讯 BrandID、名称、同步时间和对应平台企业投影
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 品牌不在平台目录中
        "422":
          description: 统一凭证未配置、不可用或腾讯拒绝品牌详情查询
        "429":
          description: 腾讯 AnswerBit 限流
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "502":
          description: 腾讯服务或响应暂时异常
        "504":
          description: 腾讯品牌详情查询超时
    patch:
      summary: 修改腾讯企业
      description: 先读取腾讯官方品牌详情，再按上游契约保留默认语言和商品关键词、以数组提交官网，并调用 `/geo/brand/update`；上游成功后才更新品牌目录和对应平台企业投影。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: brandId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - brandName
              properties:
                brandName:
                  type: string
                  minLength: 1
                  maxLength: 255
                brandAlias:
                  type: string
                  maxLength: 255
                  default: ""
                website:
                  oneOf:
                    - const: ""
                    - type: string
                      format: uri
                  default: ""
                description:
                  type: string
                  maxLength: 5000
                  default: ""
                note:
                  type: string
                  maxLength: 2000
                  default: ""
                websiteAutoTrace:
                  type: boolean
                  default: false
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: 腾讯企业及平台投影均已更新
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 腾讯企业不存在或尚未完成平台投影
        "422":
          description: 统一凭证未配置、不可用或腾讯拒绝品牌更新；错误详情包含 operation、HTTP 状态和业务码
        "429":
          description: 腾讯 AnswerBit 限流
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "502":
          description: 腾讯服务或响应暂时异常
        "504":
          description: 腾讯企业修改超时
    delete:
      summary: 删除腾讯企业
      description: 先实际调用腾讯 `/geo/brand/delete`；上游成功后关闭对应平台企业投影，保留历史业务数据和防止目录刷新重新创建所需的删除标记。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: brandId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "204":
          description: 腾讯企业已删除，平台企业投影已关闭
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 腾讯企业不存在或尚未完成平台投影
        "422":
          description: 统一凭证未配置或不可用
        "429":
          description: 腾讯 AnswerBit 限流
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "502":
          description: 腾讯服务或响应暂时异常
        "504":
          description: 腾讯企业删除超时
  /v1/admin/answerbit-brands/{brandId}/icon:
    put:
      summary: 更新腾讯企业 Logo
      description: 调用腾讯 `/geo/brand/update/icon` 更新品牌图片；基础资料修改与 Logo 更新使用独立请求，避免任一操作失败时产生含混的部分成功响应。
      tags:
        - Platform Admin
      security:
        - cookieSession: []
      parameters:
        - in: path
          name: brandId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - iconMimeType
                - iconData
              properties:
                iconMimeType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/jpg
                    - image/png
                    - image/gif
                    - image/webp
                    - image/svg+xml
                iconData:
                  type: string
                  minLength: 1
                  maxLength: 2796204
                  pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
                  description: 有效 Base64 图片内容；解码后的原始文件最大 2MB，内容签名必须与 iconMimeType 匹配
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "200":
          description: Logo 已更新，返回 Tencent BrandID 和腾讯图片地址
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 腾讯企业不存在或尚未完成平台投影
        "422":
          description: 统一凭证未配置、不可用或腾讯拒绝 Logo 更新
        "429":
          description: 腾讯 AnswerBit 限流
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "502":
          description: 腾讯服务或响应暂时异常
        "504":
          description: 腾讯 Logo 更新超时
