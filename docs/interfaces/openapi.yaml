  /v1/answerbit/articles:
    get:
      summary: 使用 scrollId 游标查询品牌文章库
      tags:
        - Articles
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/TeamBindingId"
        - $ref: "#/components/parameters/BrandId"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: scrollId
          schema:
            type: string
        - in: query
          name: title
          schema:
            type: string
        - in: query
          name: statuses
          description: 逗号分隔的状态值
          schema:
            type: string
        - in: query
          name: sources
          description: 逗号分隔的来源值
          schema:
            type: string
      responses:
        "200":
          description: 文章列表、下一页游标和数量
    post:
      summary: 录入一个或多个公开 URL 并追踪文章
      tags:
        - Articles
      security:
        - cookieSession: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraceArticle"
      responses:
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "201":
          description: 腾讯确认文章已加入追踪
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ArticleTrackingSubmission"
        "200":
          description: 已确认原追踪提交；不重复调用腾讯或扣积分
        "202":
          description: 提交状态为 submitting、failed 或 uncertain；failed/uncertain 已返还积分，不表示腾讯创建成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          description: 品牌积分不足，不创建提交或调用腾讯
        "409":
          description: FEATURE_PRICE_CHANGED 报价变化或 ARTICLE_TRACKING_IDEMPOTENCY_CONFLICT 原操作者、范围或内容不一致
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/answerbit/article-tracking-submissions:
    get:
      summary: 查看当前用户在当前品牌最近 20 次追踪提交并恢复中断状态
      tags:
        - Articles
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/TeamBindingId"
        - $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: 仅当前操作者的追踪提交；包含原始输入用于核对，不包含密文
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArticleTrackingSubmission"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/answerbit/articles/{articleId}:
    get:
