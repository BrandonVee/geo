        - $ref: "#/components/parameters/BrandId"
        - in: query
          name: beginDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 文章追踪详情
        "404":
          description: ARTICLE_NOT_FOUND，文章不属于当前企业和品牌目录；先刷新文章目录
