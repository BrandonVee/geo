        - in: query
          name: asset
          required: false
          schema:
            type: string
            enum:
              - answerbit_points
              - publication_cny
        - in: query
          name: operation
          required: false
          schema:
            type: string
            enum:
              - grant
              - allocate
              - consume
              - restore
              - adjust
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
